{% extends "base.html" %}

{% block content %}
  <h1>Delete task?</h1>
  <p>Are you sure you want to delete the task: "<strong>{{ object.content }}</strong>"?</p>
  <div class="d-flex gap-2 mb-2 align-items-center">
    <form action="" method="post">
      {% csrf_token %}

      <input type="submit" value="Yes" class="btn btn-danger">
    </form>
    <a href="{% url 'todo:tag_list' %}" class="btn btn-secondary">No, go back</a>
  </div>
{% endblock %}
